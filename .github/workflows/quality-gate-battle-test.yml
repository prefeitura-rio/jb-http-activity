name: Quality Gate Battle Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: detect
        uses: prefeitura-rio/actions/quality-gate@faa269d3ccac57b292e2bc6e57fcd714b04047fc
        with:
          check: detect-only

      - name: Assert TypeScript detection
        env:
          LANGUAGES: ${{ steps.detect.outputs.languages }}
        run: test "$LANGUAGES" = '["typescript"]'

  checks:
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - app:format
          - app:lint
          - app:strlint
          - app:typecheck
          - app:test

    steps:
      - uses: actions/checkout@v4

      - id: quality-gate
        continue-on-error: true
        uses: prefeitura-rio/actions/quality-gate@faa269d3ccac57b292e2bc6e57fcd714b04047fc
        with:
          check: ${{ matrix.check }}

      - name: Record result
        if: always()
        run: |
          {
            echo "### ${{ matrix.check }}"
            echo "Outcome: ${{ steps.quality-gate.outcome }}"
            echo "Error: ${{ steps.quality-gate.outputs.error_message }}"
          } >> "$GITHUB_STEP_SUMMARY"
